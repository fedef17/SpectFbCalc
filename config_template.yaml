kernels:
   HUANG:
      path_input: "/kernels/huang/kernel-highR/toa/"
      filename_template: "RRTMG_{}_toa_{}_highR.nc"
   SPECTRAL:
      path_input: "/kernels/spectral/"
   
file_paths:
   reference_dataset: "/sample_data/reference/"
   experiment_dataset: "/sample_data/experiment/"
   pressure_data: "" #to specify if you have ps values in a different file and not in an array
   output: "/output/"

control_type: 'PI'
exp_type: '4x'

exp_name: "test"

anomaly_method: "climatology" #specify the anomaly method: climatology, running_m, climatology_mean, running_m_mean
save_pattern: True
num_year_regr: 1 #number of years to group for regression
num_running_years_trend: 3 #number of years to group for running trend
time_range_clim: #this is the time range for the reference dataset 
   start: ""
   end: ""
time_range_exp: #this is the time range for the experiment dataset, give it empty if you want to use the same as the reference dataset
   start: ""
   end: ""

lon_range: #this is the longitude range for the dataset, give it empty if you want to use the same as the reference dataset
   start:
   end: 
lat_range: #this is the latitude range for the dataset, give it empty if you want to use the same as the reference dataset
   start:
   end:

time_chunk: 12